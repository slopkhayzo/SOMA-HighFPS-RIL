; SOMA.FPSFix configuration
; Keep this file beside SOMA.FPSFix.asi. Changes apply on the next launch.

[General]
; false disables the fix completely without removing any file.
Enabled = true
Diagnostics = true

[Logging]
; Nothing in this section changes what the fix does.
; One short status line in SOMA.FPSFix.log every ReportIntervalSeconds.
HealthReports = true
ReportIntervalSeconds = 5
; Writes every internal counter each interval instead of the short line.
; Turn on only when reporting a problem.
DetailedReports = false

[Features]
; Lets the game draw faster than its 60 Hz simulation. Everything below
; depends on it. Use VSync or an external frame limiter with it.
RenderUnlock = true
; Smooths the camera between simulation ticks.
CameraInterpolation = true
; Smooths the first-person hands and anything they hold.
HandsRootInterpolation = true
HandsPoseInterpolation = true
; Smooths props, doors, debris, and animated props.
WorldRootInterpolation = true
WorldPoseInterpolation = true
; Smooths character and creature animation.
AgentPoseInterpolation = true
; Smooths physics-driven skeletons such as hanging cables.
RagdollPoseInterpolation = true
; Mouse look at the display rate instead of 60 Hz. Requires Smooth Mouse to
; be off in the game's input options; with it on, mouse look stays
; interpolated.
MouseOverlay = true
; Menu, pause-menu, and terminal cursors at the display rate.
GuiMouseOverlay = true

; Implemented but not validated in play; leave off.
AgentRootInterpolation = false

; Not implemented. Setting any of these to true disables the whole fix.
PresentationLimiter = false
ToolInterpolation = false
ParticleInterpolation = false
ImageTrailTiming = false

[Timing]
; Reserved. The fix does not limit the frame rate itself.
TargetFPS = 0
